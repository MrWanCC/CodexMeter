name: Release Software Edition

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing software release tag, for example v0.1.2"
        required: true

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  validate-source:
    name: Validate software release source
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid software release tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Validate software release source
        shell: bash
        run: |
          git fetch origin software-edition:refs/remotes/origin/software-edition
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/software-edition; then
            echo "Tag ${RELEASE_TAG} is not contained in software-edition." >&2
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}

  build-windows:
    name: Build Windows portable
    runs-on: windows-latest
    needs: validate-source
    env:
      RELEASE_TAG: ${{ needs.validate-source.outputs.release-tag }}

    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-source.outputs.release-tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Windows portable app
        run: npm run dist:portable

      - name: Collect Windows asset
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item -LiteralPath "release/CodexMeter $version.exe" -Destination "release-assets/CodexMeter-$env:RELEASE_TAG-win-x64-portable.exe"

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: software-windows
          path: release-assets/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }} DMG
    runs-on: macos-latest
    needs: validate-source
    env:
      RELEASE_TAG: ${{ needs.validate-source.outputs.release-tag }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-source.outputs.release-tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS icon
        run: |
          mkdir -p build/icon.iconset
          sips -z 16 16 build/icon.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32 build/icon.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 build/icon.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64 build/icon.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 build/icon.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256 build/icon.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 build/icon.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512 build/icon.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 build/icon.png --out build/icon.iconset/icon_512x512.png
          sips -z 1024 1024 build/icon.png --out build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Test
        run: npm test

      - name: Build macOS DMG
        run: npm run dist:mac -- --${{ matrix.arch }}

      - name: Collect macOS asset
        run: |
          mkdir -p release-assets
          cp release/*.dmg "release-assets/CodexMeter-${RELEASE_TAG}-software-mac-${{ matrix.arch }}.dmg"

      - name: Upload macOS asset
        uses: actions/upload-artifact@v4
        with:
          name: software-macos-${{ matrix.arch }}
          path: release-assets/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-source
      - build-windows
      - build-macos
    env:
      RELEASE_TAG: ${{ needs.validate-source.outputs.release-tag }}

    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-source.outputs.release-tag }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Render release notes
        shell: bash
        run: |
          sed "s/__RELEASE_TAG__/${RELEASE_TAG}/g" .github/release-notes/software.md > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "CodexMeter $RELEASE_TAG - Software Edition" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "CodexMeter $RELEASE_TAG - Software Edition" --notes-file release-notes.md --latest
          fi
